name: sam_sgd_momentum
family: sharpness_aware
in_syllabus: true
update_rule: "e = rho g / ||g||;  g' = grad L(theta + e);  restore theta;  SGD+momentum step with g'"
reference: "Foret et al. (2021)"
fixed: {momentum: 0.9}
search_space:
  lr: {type: log_uniform, low: 1.0e-4, high: 1.0}
  weight_decay: {type: log_uniform, low: 1.0e-6, high: 1.0e-2, p_zero: 0.5}
  rho: {type: log_uniform, low: 0.01, high: 0.5}
