name: adabelief
family: adaptive
in_syllabus: false
update_rule: "Adam with s <- b2 s + (1-b2) (g - m)^2 in place of v (adabelief-pytorch, rectify off)"
reference: "Zhuang et al. (2020)"
fixed: {betas: [0.9, 0.999], eps: 1.0e-16, weight_decouple: true, rectify: false}
search_space:
  lr: {type: log_uniform, low: 1.0e-5, high: 1.0e-1}
  weight_decay: {type: log_uniform, low: 1.0e-6, high: 1.0e-2, p_zero: 0.5}
