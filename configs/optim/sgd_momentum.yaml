name: sgd_momentum
family: momentum
in_syllabus: true
update_rule: "v <- mu v + g;  theta <- theta - lr v"
reference: "Polyak (1964), heavy-ball momentum"
fixed: {momentum: 0.9}
search_space:
  lr: {type: log_uniform, low: 1.0e-4, high: 1.0}
  weight_decay: {type: log_uniform, low: 1.0e-6, high: 1.0e-2, p_zero: 0.5}
