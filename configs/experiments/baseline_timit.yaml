name: baseline_timit
phase: baseline
description: >
  Phase 2 on OptLab-TIMIT (open data, built by `optlab fetch-timit`). Late-fusion heads on
  cached CLIP / wav2vec 2.0 / frequency features, equal tuning budget per optimizer, 5 seeds.
  Train on VidTIMIT reals + DeepfakeTIMIT higher-quality fakes; in-distribution test on
  held-out identities of the same; "unseen" test on the same held-out identities with the
  lower-quality fakes (a different generator model size). Audio is untouched in the fakes,
  so the audio stream is a control that should carry no signal.
hypothesis: >
  Adaptive optimizers converge faster but show a larger HQ-to-LQ generalization gap than SGD
  with momentum; SAM narrows the gap. The fitted fusion weight on audio is near zero for
  every optimizer.
train_dataset: optlab_timit_hq
eval:
  in_distribution: optlab_timit_hq
  cross_dataset: [optlab_timit_lq]
model: clip_vit_b16__wav2vec2__freq__weighted_sum
optimizers: [sgd, sgd_momentum, nag, rmsprop, adam, adamw, radam, adabelief, lion, sam_sgd_momentum]
tuning: {method: random, trials: 20, epochs: 10, seed: 0}
training: {max_epochs: 30, batch_size: 256, patience: 5, clip_norm: null, schedule: constant}
seeds: [0, 1, 2, 3, 4]
