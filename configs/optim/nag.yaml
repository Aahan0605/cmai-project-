name: nag
family: momentum
in_syllabus: true
update_rule: "v <- mu v + g;  theta <- theta - lr (g + mu v)"
reference: "Nesterov (1983); PyTorch formulation"
fixed: {momentum: 0.9}
search_space:
  lr: {type: log_uniform, low: 1.0e-4, high: 1.0}
  weight_decay: {type: log_uniform, low: 1.0e-6, high: 1.0e-2, p_zero: 0.5}
