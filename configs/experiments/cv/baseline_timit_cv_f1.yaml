# Generated by `optlab cv`; edit the base config instead.
name: baseline_timit_cv_f1
phase: baseline
description: 'Fold 1 of 8 of baseline_timit_cv. Gate 1 follow-up to baseline_timit_v3
  on OptLab-TIMIT (32 face-swapped people, 16 swap pairs). (1) Fusion fits simplex
  weights together with a learned temperature, so the weights no longer absorb logit
  scale. (2) 8-fold cross-validation grouped by swap pair: each fold tests 2 pairs
  (4 people), validates on the next fold''s 2 pairs (one for tuning, one for fusion)
  and trains on the other 12, so all 32 people are tested once and optimizers are
  compared paired by fold. Tuning budget, seeds and training settings as in v3.

  '
hypothesis: 'Adaptive optimizers converge faster but show a larger HQ-to-LQ generalization
  gap than SGD with momentum; SAM narrows the gap. The fitted fusion weight on audio
  is near zero for every optimizer.

  '
train_dataset: optlab_timit_hq
eval:
  in_distribution: optlab_timit_hq
  cross_dataset:
  - optlab_timit_lq
model: clip_vit_b16__wav2vec2__freq__weighted_sum
optimizers:
- sgd
- sgd_momentum
- nag
- rmsprop
- adam
- adamw
- radam
- adabelief
- lion
- sam_sgd_momentum
tuning:
  method: random
  trials: 20
  epochs: 10
  seed: 0
training:
  max_epochs: 30
  batch_size: 256
  patience: 5
  clip_norm: null
  schedule: constant
seeds:
- 0
- 1
- 2
- 3
- 4
fusion: simplex_temperature
fusion_ridge: 0.001
cv_folds: 8
cv_seed: 0
manifests_dir: manifests/cv/baseline_timit_cv/f1
features_dir: features
artifacts_dir: artifacts
device: cpu
